<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="plat-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="plat-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#075985"/>
      <stop offset="1" stop-color="#0C1A2E"/>
    </linearGradient>
    <linearGradient id="plat-emblem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F9FF"/>
      <stop offset="0.4" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="plat-shine" cx="50%" cy="25%" r="55%">
      <stop offset="0" stop-color="#F0F9FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plat-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#plat-halo)"/>
  <circle cx="64" cy="64" r="60" fill="url(#plat-outer)" stroke="#0C1A2E" stroke-width="2"/>
  <circle cx="64" cy="64" r="60" fill="url(#plat-shine)"/>
  <circle cx="64" cy="64" r="48" fill="url(#plat-inner)" stroke="#0C1A2E" stroke-width="1.5"/>
  <!-- 6-pointed star (snowflake) -->
  <g transform="translate(64 64)" stroke="#0C1A2E" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 0 -32 L 8 -10 L 30 -6 L 12 8 L 18 30 L 0 18 L -18 30 L -12 8 L -30 -6 L -8 -10 Z"
          fill="url(#plat-emblem)"/>
    <!-- 6 branches (angle 60° each) -->
    <g fill="#F0F9FF" opacity="0.45">
      <path d="M 0 -32 L 4 -12 L -4 -12 Z"/>
      <path d="M 0 -32 L 4 -12 L -4 -12 Z" transform="rotate(60)"/>
      <path d="M 0 -32 L 4 -12 L -4 -12 Z" transform="rotate(120)"/>
      <path d="M 0 -32 L 4 -12 L -4 -12 Z" transform="rotate(180)"/>
      <path d="M 0 -32 L 4 -12 L -4 -12 Z" transform="rotate(240)"/>
      <path d="M 0 -32 L 4 -12 L -4 -12 Z" transform="rotate(300)"/>
    </g>
  </g>
  <!-- Central reflection -->
  <circle cx="64" cy="64" r="5" fill="#F0F9FF" opacity="0.9"/>
</svg>
