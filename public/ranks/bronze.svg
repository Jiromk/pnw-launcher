<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bronze-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="0.5" stop-color="#92400E"/>
      <stop offset="1" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="bronze-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350F"/>
      <stop offset="1" stop-color="#2A1206"/>
    </linearGradient>
    <linearGradient id="bronze-emblem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="0.4" stop-color="#D97706"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="bronze-shine" cx="50%" cy="25%" r="55%">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer plate -->
  <circle cx="64" cy="64" r="60" fill="url(#bronze-outer)" stroke="#1A0A01" stroke-width="2"/>
  <circle cx="64" cy="64" r="60" fill="url(#bronze-shine)"/>
  <!-- Inner ring -->
  <circle cx="64" cy="64" r="48" fill="url(#bronze-inner)" stroke="#1A0A01" stroke-width="1.5"/>
  <!-- Triangular gem -->
  <path d="M 64 34 L 90 82 L 38 82 Z"
        fill="url(#bronze-emblem)" stroke="#1A0A01" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner facets -->
  <path d="M 64 34 L 64 82 L 38 82 Z" fill="#78350F" opacity="0.4"/>
  <path d="M 64 34 L 76 58 L 64 82 Z" fill="#FBBF24" opacity="0.45"/>
  <!-- Center highlight -->
  <circle cx="64" cy="64" r="4" fill="#FEF3C7" opacity="0.6"/>
</svg>
