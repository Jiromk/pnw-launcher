<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="em-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="0.45" stop-color="#10B981"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="em-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#0A1F17"/>
    </linearGradient>
    <linearGradient id="em-emblem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/>
      <stop offset="0.4" stop-color="#34D399"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
    <radialGradient id="em-shine" cx="50%" cy="25%" r="55%">
      <stop offset="0" stop-color="#ECFDF5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="em-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#em-halo)"/>
  <circle cx="64" cy="64" r="60" fill="url(#em-outer)" stroke="#022C22" stroke-width="2"/>
  <circle cx="64" cy="64" r="60" fill="url(#em-shine)"/>
  <circle cx="64" cy="64" r="48" fill="url(#em-inner)" stroke="#022C22" stroke-width="1.5"/>
  <!-- Emerald-cut gem (hexagonal with beveled corners) -->
  <g transform="translate(64 64)">
    <path d="M -26 -22 L -18 -32 L 18 -32 L 26 -22 L 26 22 L 18 32 L -18 32 L -26 22 Z"
          fill="url(#em-emblem)" stroke="#022C22" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner rectangle (step cut) -->
    <path d="M -20 -18 L -14 -24 L 14 -24 L 20 -18 L 20 18 L 14 24 L -14 24 L -20 18 Z"
          fill="none" stroke="#022C22" stroke-width="1.2" opacity="0.6"/>
    <!-- Top facet highlight -->
    <path d="M -26 -22 L -18 -32 L 18 -32 L 26 -22 L 20 -18 L 14 -24 L -14 -24 L -20 -18 Z"
          fill="#D1FAE5" opacity="0.45"/>
    <!-- Left facet -->
    <path d="M -26 -22 L -20 -18 L -20 18 L -26 22 Z"
          fill="#ECFDF5" opacity="0.3"/>
    <!-- Right facet -->
    <path d="M 26 -22 L 20 -18 L 20 18 L 26 22 Z"
          fill="#065F46" opacity="0.5"/>
    <!-- Central sparkle -->
    <circle cx="0" cy="0" r="3.5" fill="#ECFDF5" opacity="0.85"/>
  </g>
</svg>
