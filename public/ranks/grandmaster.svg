<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gm-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FECACA"/>
      <stop offset="0.45" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="gm-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#991B1B"/>
      <stop offset="1" stop-color="#2C0909"/>
    </linearGradient>
    <linearGradient id="gm-gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEE2E2"/>
      <stop offset="0.4" stop-color="#F87171"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="gm-crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="gm-shine" cx="50%" cy="25%" r="55%">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gm-halo" cx="50%" cy="50%" r="55%">
      <stop offset="0.6" stop-color="#EF4444" stop-opacity="0"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0.65"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="63" fill="url(#gm-halo)"/>
  <circle cx="64" cy="64" r="60" fill="url(#gm-outer)" stroke="#2C0909" stroke-width="2"/>
  <circle cx="64" cy="64" r="60" fill="url(#gm-shine)"/>
  <!-- Outer ring ornaments (laurels left/right) -->
  <g stroke="#FEF3C7" stroke-width="1.4" fill="none" opacity="0.8" stroke-linecap="round">
    <!-- Left laurel -->
    <path d="M 18 46 Q 12 64 18 82"/>
    <path d="M 15 52 Q 20 54 22 50"/>
    <path d="M 13 62 Q 18 64 20 60"/>
    <path d="M 13 72 Q 18 74 20 70"/>
    <path d="M 15 80 Q 20 82 22 78"/>
    <!-- Right laurel -->
    <path d="M 110 46 Q 116 64 110 82"/>
    <path d="M 113 52 Q 108 54 106 50"/>
    <path d="M 115 62 Q 110 64 108 60"/>
    <path d="M 115 72 Q 110 74 108 70"/>
    <path d="M 113 80 Q 108 82 106 78"/>
  </g>
  <!-- Inner ring -->
  <circle cx="64" cy="64" r="48" fill="url(#gm-inner)" stroke="#2C0909" stroke-width="1.5"/>
  <!-- Ornate crown (taller, 5 peaks with gems) -->
  <g transform="translate(64 46)">
    <!-- Crown outline -->
    <path d="M -28 2 L -28 -14 L -18 -6 L -12 -20 L -4 -8 L 0 -22 L 4 -8 L 12 -20 L 18 -6 L 28 -14 L 28 2 Z"
          fill="url(#gm-crown)" stroke="#451A03" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Gems on crown peaks -->
    <circle cx="-18" cy="-6" r="1.8" fill="#60A5FA"/>
    <circle cx="-12" cy="-20" r="1.6" fill="#EF4444"/>
    <circle cx="0"   cy="-22" r="2.4" fill="#FBBF24" stroke="#78350F" stroke-width="0.5"/>
    <circle cx="12"  cy="-20" r="1.6" fill="#EF4444"/>
    <circle cx="18"  cy="-6" r="1.8" fill="#60A5FA"/>
    <!-- Crown base band with detail -->
    <rect x="-30" y="0" width="60" height="6" rx="2" fill="url(#gm-crown)" stroke="#451A03" stroke-width="1.3"/>
    <line x1="-22" y1="3" x2="22" y2="3" stroke="#78350F" stroke-width="0.6" opacity="0.7"/>
  </g>
  <!-- Central gem (elongated diamond) -->
  <g transform="translate(64 80)">
    <path d="M 0 -18 L 14 -4 L 18 0 L 14 4 L 0 18 L -14 4 L -18 0 L -14 -4 Z"
          fill="url(#gm-gem)" stroke="#2C0909" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 0 -18 L 14 -4 L 0 0 Z" fill="#FEE2E2" opacity="0.55"/>
    <path d="M 0 -18 L -14 -4 L 0 0 Z" fill="#FECACA" opacity="0.45"/>
    <circle cx="0" cy="-2" r="2" fill="#FFF" opacity="0.9"/>
  </g>
</svg>
