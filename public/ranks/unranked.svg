<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="un-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="un-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="un-shine" cx="50%" cy="25%" r="55%">
      <stop offset="0" stop-color="#CBD5E1" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer plate -->
  <circle cx="64" cy="64" r="60" fill="url(#un-outer)" stroke="#020617" stroke-width="2"/>
  <circle cx="64" cy="64" r="60" fill="url(#un-shine)"/>
  <!-- Dashed inner ring (non classé) -->
  <circle cx="64" cy="64" r="48" fill="url(#un-inner)" stroke="#475569" stroke-width="1.5"
          stroke-dasharray="4 3" opacity="0.85"/>
  <!-- Central question mark / placeholder shape -->
  <g transform="translate(64 64)" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -12 -12 Q -12 -24 0 -24 Q 12 -24 12 -12 Q 12 -4 0 2 L 0 10"/>
    <circle cx="0" cy="22" r="2.5" fill="#94A3B8" stroke="none"/>
  </g>
</svg>
