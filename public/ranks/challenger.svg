<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ch-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="0.3" stop-color="#FBBF24"/>
      <stop offset="0.7" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="ch-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#1F0A00"/>
    </linearGradient>
    <linearGradient id="ch-gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="0.35" stop-color="#FBBF24"/>
      <stop offset="0.7" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="ch-crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="0.4" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="ch-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="ch-shine" cx="50%" cy="22%" r="60%">
      <stop offset="0" stop-color="#FEF9C3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ch-halo" cx="50%" cy="50%" r="60%">
      <stop offset="0.55" stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="ch-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Strong double halo -->
  <circle cx="64" cy="64" r="63" fill="url(#ch-halo)"/>
  <!-- Wings behind the plate -->
  <g fill="url(#ch-wing)" stroke="#451A03" stroke-width="1.4" stroke-linejoin="round" opacity="0.92">
    <!-- Left wing -->
    <path d="M 10 64 Q 2 54 6 44 Q 18 50 22 56 Q 14 54 12 60 Q 22 62 24 68 Q 16 64 14 70 Q 22 70 24 76 Q 14 72 10 68 Z"/>
    <!-- Right wing -->
    <path d="M 118 64 Q 126 54 122 44 Q 110 50 106 56 Q 114 54 116 60 Q 106 62 104 68 Q 112 64 114 70 Q 106 70 104 76 Q 114 72 118 68 Z"/>
  </g>
  <!-- Outer plate -->
  <circle cx="64" cy="64" r="56" fill="url(#ch-outer)" stroke="#1F0A00" stroke-width="2"/>
  <circle cx="64" cy="64" r="56" fill="url(#ch-shine)"/>
  <!-- Decorative rays -->
  <g stroke="#FEF9C3" stroke-width="1" opacity="0.65" stroke-linecap="round">
    <line x1="64" y1="14" x2="64" y2="20"/>
    <line x1="64" y1="108" x2="64" y2="114"/>
    <line x1="14" y1="64" x2="20" y2="64"/>
    <line x1="108" y1="64" x2="114" y2="64"/>
    <line x1="28" y1="28" x2="32" y2="32"/>
    <line x1="100" y1="28" x2="96" y2="32"/>
    <line x1="28" y1="100" x2="32" y2="96"/>
    <line x1="100" y1="100" x2="96" y2="96"/>
  </g>
  <!-- Inner ring -->
  <circle cx="64" cy="64" r="44" fill="url(#ch-inner)" stroke="#1F0A00" stroke-width="1.5"/>
  <!-- Elaborate crown with 7 peaks -->
  <g transform="translate(64 44)" filter="url(#ch-glow)">
    <path d="M -30 4 L -30 -10 L -22 -4 L -18 -18 L -10 -8 L -6 -24 L 0 -12 L 6 -24 L 10 -8 L 18 -18 L 22 -4 L 30 -10 L 30 4 Z"
          fill="url(#ch-crown)" stroke="#451A03" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Gems on peaks -->
    <circle cx="-22" cy="-4" r="1.6" fill="#60A5FA"/>
    <circle cx="-18" cy="-18" r="1.4" fill="#10B981"/>
    <circle cx="-6"  cy="-24" r="1.8" fill="#EF4444"/>
    <circle cx="0"   cy="-12" r="2.6" fill="#FEF9C3" stroke="#78350F" stroke-width="0.5"/>
    <circle cx="6"   cy="-24" r="1.8" fill="#EF4444"/>
    <circle cx="18"  cy="-18" r="1.4" fill="#10B981"/>
    <circle cx="22"  cy="-4" r="1.6" fill="#60A5FA"/>
    <!-- Crown base with ornament -->
    <rect x="-32" y="2" width="64" height="7" rx="2" fill="url(#ch-crown)" stroke="#451A03" stroke-width="1.3"/>
    <circle cx="-20" cy="5.5" r="1.2" fill="#EF4444"/>
    <circle cx="0" cy="5.5" r="1.4" fill="#60A5FA"/>
    <circle cx="20" cy="5.5" r="1.2" fill="#EF4444"/>
  </g>
  <!-- Central starburst gem -->
  <g transform="translate(64 82)">
    <!-- 8-point star -->
    <path d="M 0 -18 L 4 -6 L 16 -4 L 6 4 L 10 16 L 0 10 L -10 16 L -6 4 L -16 -4 L -4 -6 Z"
          fill="url(#ch-gem)" stroke="#1F0A00" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Central gem -->
    <circle cx="0" cy="0" r="4" fill="#FEF9C3" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="0" cy="-1.2" r="1.6" fill="#FFF" opacity="0.95"/>
  </g>
</svg>
